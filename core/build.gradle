// ZeroTier JNI 绑定模块（MPL-2.0 组件的构建壳，自有文件）。
// Java SDK 源码 vendor 于 ../externals/core/java/src，经 srcDirs 重定向编译；
// native 构建走树外 CMake（../externals/CMakeLists.txt）。
// NDK 钉 25.2：NDK 26+ 移除 minSdk 19 支持的旧工具链行为，此组合已验证。
plugins {
    id 'com.android.library'
}

// ZeroTier 核心源码不入库，由 scripts/bootstrap.sh 按官方 tag 拉取；
// 缺失时给出可执行的补救指引，避免用户面对 CMake/GLOB 报错。
def coreStamp = file('../externals/core/.fetched-tag')
if (!coreStamp.exists()) {
    throw new GradleException(
        '缺少 ZeroTier 核心源码（externals/core/）。' +
        '请先在仓库根目录执行 ./scripts/bootstrap.sh 拉取，再重新构建。')
}

android {
    namespace 'com.zerotier.sdk'
    compileSdk 36
    ndkVersion "25.2.9519653"

    defaultConfig {
        minSdk 23
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path file('../externals/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        // srcDirs 赋值是替换语义：只写 vendor 目录会把默认 src/main/java
        // 静默移出编译路径，两个目录都显式列出
        main.java.srcDirs = ['src/main/java', '../externals/core/java/src']
    }
}

dependencies {
}
