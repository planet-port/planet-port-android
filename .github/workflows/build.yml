name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

jobs:
  build:
    # tag 推走 release job，debug 构建只跑分支
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # AGP 通常在 license 接受后自动安装缺失组件；若未自动安装导致构建
      # 失败，取消下面步骤的注释以显式预装：
      # - name: Preinstall Android SDK components
      #   run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-36"

      - name: 拉取 ZeroTier 核心源码
        run: ./scripts/bootstrap.sh

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # 推送 v* tag 时构建 release APK 并创建 GitHub Release
    # （构建逻辑在可复用工作流，与网页发版 release-dispatch.yml 共用）
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
